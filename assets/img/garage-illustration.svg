<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Taporaa doorstep automotive service promotional banner</title>
  <desc id="desc">Two overlapping smartphone mockups. The rear phone shows a local garage discovery app interface. The front phone features a mechanic beside a motorcycle and the message Doorstep service, anywhere, anytime.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset=".18" stop-color="#7C8794"/>
      <stop offset=".34" stop-color="#FFFFFF"/>
      <stop offset=".56" stop-color="#65717E"/>
      <stop offset=".78" stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#64707D"/>
    </linearGradient>
    <linearGradient id="screenBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2FA"/>
      <stop offset=".6" stop-color="#F4F2ED"/>
      <stop offset="1" stop-color="#E7E3D9"/>
    </linearGradient>
    <linearGradient id="frontScreen" x1=".12" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#172C27"/>
      <stop offset=".4" stop-color="#38463D"/>
      <stop offset=".74" stop-color="#202A29"/>
      <stop offset="1" stop-color="#070B0D"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B0D" stop-opacity="0"/>
      <stop offset=".34" stop-color="#070B0D" stop-opacity=".22"/>
      <stop offset=".58" stop-color="#070B0D" stop-opacity=".88"/>
      <stop offset="1" stop-color="#070B0D" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F21B65"/>
      <stop offset="1" stop-color="#D80B55"/>
    </linearGradient>
    <linearGradient id="bikeRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F05A4E"/>
      <stop offset="1" stop-color="#9E2028"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263D55"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset dy="15" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="15"/></filter>
    <clipPath id="rearClip"><rect x="105" y="135" width="385" height="850" rx="49"/></clipPath>
    <clipPath id="frontClip"><rect x="420" y="24" width="570" height="970" rx="66"/></clipPath>
  </defs>

  <!-- Rear phone: app discovery screen -->
  <g transform="rotate(-1.8 300 550)" filter="url(#phoneShadow)">
    <rect x="70" y="104" width="452" height="880" rx="78" fill="#111820"/>
    <rect x="73" y="107" width="446" height="874" rx="75" stroke="url(#metal)" stroke-width="8"/>
    <rect x="88" y="122" width="416" height="844" rx="61" fill="#0B1016"/>
    <g clip-path="url(#rearClip)">
      <rect x="105" y="135" width="385" height="850" fill="url(#screenBack)"/>
      <rect x="105" y="135" width="385" height="850" fill="#FFFFFF" opacity=".08"/>
      <text x="130" y="177" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17202C">9:41</text>
      <g fill="#17202C" opacity=".8"><rect x="425" y="158" width="22" height="10" rx="2"/><rect x="451" y="155" width="5" height="13" rx="1"/><path d="M463 158h15v10h-15z"/></g>
      <g transform="translate(130 205)">
        <rect width="39" height="39" rx="12" fill="#111827"/>
        <path d="M8 12h23v5H8zM8 21h17v5H8z" fill="#F11B63"/>
        <path d="M10 29h19" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="50" y="17" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#14202C">GarageOne</text>
        <text x="50" y="37" font-family="Arial, sans-serif" font-size="11" fill="#697586">YOUR VEHICLE. OUR PRIORITY.</text>
        <circle cx="331" cy="18" r="19" fill="#FFFFFF"/>
        <path d="M323 17c0-5 3-8 8-8s8 3 8 8v8h-16z" stroke="#263445" stroke-width="2" fill="none"/>
        <path d="M320 17h22" stroke="#263445" stroke-width="2"/>
      </g>
      <text x="130" y="292" font-family="Arial, sans-serif" font-size="17" fill="#647084">Your location</text>
      <text x="130" y="321" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172337">Nagpur, Maharashtra</text>
      <rect x="128" y="344" width="335" height="54" rx="17" fill="#FFFFFF" stroke="#DDE3EC"/>
      <circle cx="153" cy="370" r="9" stroke="#8894A5" stroke-width="2"/>
      <path d="m160 377 8 8" stroke="#8894A5" stroke-width="2" stroke-linecap="round"/>
      <text x="180" y="376" font-family="Arial, sans-serif" font-size="15" fill="#8490A1">Search service, issue or garage</text>
      <text x="130" y="442" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172337">Explore services</text>
      <g font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
        <rect x="128" y="458" width="91" height="74" rx="16" fill="#FFFFFF"/>
        <circle cx="173" cy="482" r="14" fill="#FCE4ED"/><path d="M164 484h18l-2-8h-14zM166 486v5m14-5v5" stroke="#E4145B" stroke-width="2" stroke-linejoin="round"/>
        <text x="173" y="519" fill="#354254">Puncture</text>
        <rect x="230" y="458" width="91" height="74" rx="16" fill="#FFFFFF"/>
        <circle cx="275" cy="482" r="14" fill="#FCE4ED"/><path d="M267 487l15-15 4 4-15 15h-4zM266 488l-1 4 4-1" stroke="#E4145B" stroke-width="2"/>
        <text x="275" y="519" fill="#354254">Repair</text>
        <rect x="332" y="458" width="91" height="74" rx="16" fill="#FFFFFF"/>
        <circle cx="377" cy="482" r="14" fill="#FCE4ED"/><path d="M368 482h18m-9-9v18" stroke="#E4145B" stroke-width="2.5" stroke-linecap="round"/>
        <text x="377" y="519" fill="#354254">Towing</text>
      </g>
      <text x="130" y="581" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172337">Nearby garages</text>
      <text x="458" y="581" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#E4145B">VIEW ALL</text>
      <g>
        <rect x="128" y="597" width="335" height="99" rx="16" fill="#FFFFFF"/>
        <rect x="140" y="609" width="76" height="74" rx="12" fill="#DCE4E8"/>
        <path d="M148 663l12-21 13 9 12-26 22 38z" fill="#738A8D"/><path d="M148 667h59" stroke="#607179" stroke-width="3"/>
        <circle cx="166" cy="651" r="8" fill="#273B49"/><circle cx="193" cy="651" r="8" fill="#273B49"/>
        <text x="230" y="627" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#202D3C">City Auto Care</text>
        <text x="230" y="649" font-family="Arial, sans-serif" font-size="11" fill="#758194">Multi-brand service centre</text>
        <text x="230" y="674" font-family="Arial, sans-serif" font-size="11" fill="#E09A21">★ 4.8  ·  1.2 km away</text>
        <rect x="128" y="707" width="335" height="99" rx="16" fill="#FFFFFF"/>
        <rect x="140" y="719" width="76" height="74" rx="12" fill="#E8DED4"/>
        <path d="M148 774v-31l30-15 28 15v31z" fill="#A96B4C"/><path d="M157 774v-22h13v22m10 0v-22h15v22" stroke="#F5E7DA" stroke-width="3"/>
        <text x="230" y="737" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#202D3C">QuickFix Garage</text>
        <text x="230" y="759" font-family="Arial, sans-serif" font-size="11" fill="#758194">Two-wheeler specialists</text>
        <text x="230" y="784" font-family="Arial, sans-serif" font-size="11" fill="#E09A21">★ 4.6  ·  2.0 km away</text>
      </g>
      <rect x="128" y="827" width="335" height="92" rx="18" fill="#172333"/>
      <text x="148" y="859" font-family="Arial, sans-serif" font-size="13" fill="#F4F6F8">Need help on the road?</text>
      <text x="148" y="883" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Find nearby assistance</text>
      <circle cx="425" cy="872" r="20" fill="#F01861"/><path d="M416 872h17m-7-7 7 7-7 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="211" y="119" width="167" height="28" rx="14" fill="#080B10"/>
    <rect x="87" y="340" width="5" height="68" rx="2.5" fill="#AAB3BC"/>
    <rect x="87" y="430" width="5" height="90" rx="2.5" fill="#AAB3BC"/>
  </g>

  <!-- Front phone: promotional screen -->
  <g filter="url(#phoneShadow)">
    <rect x="388" y="-18" width="610" height="1058" rx="91" fill="#080B10"/>
    <rect x="392" y="-14" width="602" height="1050" rx="88" stroke="url(#metal)" stroke-width="9"/>
    <rect x="408" y="5" width="570" height="1008" rx="71" fill="#10191B"/>
    <g clip-path="url(#frontClip)">
      <rect x="420" y="24" width="570" height="970" fill="url(#frontScreen)"/>
      <!-- soft workshop / outdoor background -->
      <g opacity=".7" filter="url(#softBlur)">
        <circle cx="500" cy="120" r="95" fill="#738C50"/>
        <circle cx="925" cy="145" r="115" fill="#627B4C"/>
        <rect x="450" y="174" width="500" height="260" rx="35" fill="#5E6C60"/>
        <rect x="473" y="204" width="300" height="185" rx="18" fill="#A63E34"/>
        <rect x="770" y="182" width="160" height="240" rx="20" fill="#293A39"/>
      </g>
      <rect x="465" y="184" width="390" height="270" rx="22" fill="#A63C32" opacity=".86"/>
      <rect x="489" y="207" width="340" height="197" rx="16" fill="#344648"/>
      <path d="M500 364h318" stroke="#202D30" stroke-width="10" opacity=".5"/>
      <path d="M521 214h95v151h-95z" fill="#7E9A9A" opacity=".28"/>
      <path d="M632 214h185v151H632z" fill="#839A95" opacity=".24"/>
      <!-- service motorcycle silhouette -->
      <g transform="translate(450 330)">
        <circle cx="150" cy="168" r="54" fill="#10171D" stroke="#AEB7BA" stroke-width="8"/>
        <circle cx="150" cy="168" r="22" fill="#859399"/>
        <circle cx="360" cy="168" r="54" fill="#10171D" stroke="#AEB7BA" stroke-width="8"/>
        <circle cx="360" cy="168" r="22" fill="#859399"/>
        <path d="M150 168l76-100 79 0 55 100-112 0-22-70" stroke="#C6D0D0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M223 72l-32-22 74-4 42 24-5 17h-60z" fill="url(#bikeRed)"/>
        <path d="M269 57h64l32 16-10 13h-85z" fill="#161E24"/>
        <path d="M300 72l43-33 37 3-18 18" stroke="#D4DADD" stroke-width="8" stroke-linecap="round"/>
        <path d="M349 44l28-19 24 4" stroke="#D4DADD" stroke-width="7" stroke-linecap="round"/>
        <path d="M228 81l-12 60 64 26 35-69" fill="#B32C35"/>
        <path d="M221 140l-25 19 26 9 31-19" fill="#1D2B32"/>
        <path d="M363 166l34-6 15 9" stroke="#1B252B" stroke-width="10" stroke-linecap="round"/>
      </g>
      <!-- mechanic: cap, head, torso, arms -->
      <g>
        <!-- neck -->
        <path d="M702 284h62v66h-62z" fill="#A96D50"/>
        <!-- head -->
        <ellipse cx="735" cy="228" rx="66" ry="79" fill="#BD8667"/>
        <path d="M670 225c-10-78 31-117 79-117 47 0 74 37 69 91-24-14-44-33-56-56-16 27-47 48-92 53z" fill="#172A3D"/>
        <path d="M667 171c8-54 47-83 91-78 32 3 57 25 64 59-46 12-103 15-155 19z" fill="#213B55"/>
        <path d="M681 251c13 27 31 39 54 39 28 0 49-16 60-45-8 49-29 74-61 74-30 0-47-22-53-68z" fill="#9C624A" opacity=".35"/>
        <path d="M708 222q10-8 20 0m27 0q10-8 20 0" stroke="#3A2B29" stroke-width="5" stroke-linecap="round"/>
        <path d="M727 251q13 11 27-1" stroke="#673C35" stroke-width="4" stroke-linecap="round"/>
        <!-- shoulders and work shirt -->
        <path d="M658 329c-44 20-78 66-94 143l-34 167h407l-45-174c-18-74-57-121-113-139l-39 36-39-33z" fill="url(#shirt)"/>
        <path d="M696 332l39 39 39-39 27 18-29 60-37-25-37 25-29-60z" fill="#314D66"/>
        <path d="M735 371v253" stroke="#101D2C" stroke-width="5" opacity=".65"/>
        <path d="M683 386l-50 112 35 20 58-89m63-43 52 115-33 20-62-90" fill="#183047"/>
        <!-- arms -->
        <path d="M572 462c-24 17-35 42-27 67l47 118 45-20-42-132z" fill="#B77D5D"/>
        <path d="M842 460c27 19 39 45 30 72l-48 116-44-19 44-132z" fill="#AE7657"/>
        <path d="M595 632l42-17 20 32-50 28zM790 642l42 16-17 35-49-21z" fill="#172A3B"/>
        <!-- small chest patch -->
        <rect x="768" y="405" width="44" height="31" rx="5" fill="#E9EDF0" opacity=".9"/>
        <path d="M778 416h24m-24 8h17" stroke="#E7195F" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- overlay gives contrast for the copy -->
      <rect x="420" y="24" width="570" height="970" fill="url(#shade)"/>
      <!-- brand label -->
      <g transform="translate(464 65)">
        <rect width="44" height="44" rx="13" fill="#F01861"/>
        <path d="M10 14h24v5H10zm0 10h18v5H10zm0 10h24v3H10z" fill="#FFFFFF"/>
        <text x="57" y="29" font-family="Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="1.4" fill="#FFFFFF">TAPORAA</text>
      </g>
      <!-- headline and copy -->
      <text x="462" y="623" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-.9" fill="#FFFFFF">DOORSTEP SERVICE.</text>
      <text x="462" y="679" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-.9" fill="#FFFFFF">ANYWHERE, ANYTIME.</text>
      <text x="464" y="733" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#F2F4F5">From quick fixes to complete vehicle care,</text>
      <text x="464" y="768" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#F2F4F5">Taporaa connects you with local garages</text>
      <text x="464" y="803" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#F2F4F5">and mechanics for service at your doorstep.</text>
      <!-- CTA buttons -->
      <rect x="464" y="844" width="470" height="75" rx="23" fill="url(#pink)"/>
      <text x="699" y="891" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing=".4" fill="#FFFFFF">GET STARTED</text>
      <rect x="464" y="934" width="470" height="65" rx="22" stroke="#F01861" stroke-width="2" fill="#070B0D" fill-opacity=".48"/>
      <text x="699" y="975" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">EXPLORE SERVICES</text>
    </g>
    <!-- Dynamic island and metallic controls -->
    <rect x="589" y="-3" width="205" height="37" rx="18.5" fill="#030507"/>
    <circle cx="818" cy="15" r="5" fill="#10151B"/>
    <rect x="986" y="260" width="6" height="130" rx="3" fill="#AEB6BE"/>
    <rect x="986" y="420" width="6" height="73" rx="3" fill="#AEB6BE"/>
    <rect x="389" y="238" width="6" height="72" rx="3" fill="#AEB6BE"/>
  </g>
</svg>
